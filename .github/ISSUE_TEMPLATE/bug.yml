name: Wrong typography
description: A sentence the package gets wrong, or leaves wrong.
labels: [bug]
body:
  - type: textarea
    id: sentence
    attributes:
      label: The sentence, what you got, and what it should be
      description: Paste the input exactly. Say which spaces you expect (no-break, narrow no-break, none).
      render: text
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where the rule comes from
      description: The OQLF Banque de dépannage linguistique page (fr-CA), or a published style reference (fr-FR).
  - type: input
    id: options
    attributes:
      label: Options, format and version
      description: "`locale`, `format` (text, markdown, html), and `npx maisongr-typo --version`"
    validations:
      required: true
