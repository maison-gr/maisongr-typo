# pre-commit hooks (https://pre-commit.com). A file named here is read as French, so by default only files whose
# path says French are passed: fr/…, fr.json, *.fr.md, fr.lproj/, values-fr/, fr.po, fr.yml, *_fr.properties,
# app_fr.arb, and .xcstrings (its French localizations only). Set `files:` to your own French content to widen it;
# JavaScript, TypeScript and translation files are safe to pass whatever their language (only French text is read).
- id: maisongr-typo
  name: French typography (maisongr-typo check)
  description: Lists the French typography to fix, the Québec way (OQLF) or France's; fails if there is any.
  entry: maisongr-typo check
  language: node
  types: [text]
  files: '(^|/)fr([-_][A-Za-z]{2})?(\.lproj)?/|(^|/)values-fr(-r[A-Z]{2})?/|(^|[/._-])fr([-_][A-Za-z]{2})?\.[A-Za-z]+$|\.xcstrings$'
  minimum_pre_commit_version: "3.2.0"
- id: maisongr-typo-fix
  name: French typography (maisongr-typo fix)
  description: Fixes the French typography in place, the Québec way (OQLF) or France's.
  entry: maisongr-typo fix
  language: node
  types: [text]
  files: '(^|/)fr([-_][A-Za-z]{2})?(\.lproj)?/|(^|/)values-fr(-r[A-Z]{2})?/|(^|[/._-])fr([-_][A-Za-z]{2})?\.[A-Za-z]+$|\.xcstrings$'
  minimum_pre_commit_version: "3.2.0"
